{% extends "app_shell.html" %}

{% block title %}Delete property - LeadSathi{% endblock %}

{% block app_content %}
<form method="post" class="max-w-xl rounded-md border border-[#E5DFD5] bg-white p-6">
    {% csrf_token %}
    <h1 class="mb-2 text-3xl font-light text-[#1C1C1A]" style="font-family: 'Cormorant Garamond', serif;">Delete {{ object.title }}?</h1>
    <p class="mb-6 text-sm text-[#8B7355]">This is a permanent delete and requires explicit confirmation.</p>
    <button class="rounded-md bg-[#8A341F] px-4 py-2 text-sm font-medium text-white">Yes, delete property</button>
    <a href="{% url 'properties:detail' object.pk %}" class="ml-3 rounded-md border border-[#D8CBB8] px-4 py-2 text-sm text-[#5C4A33]">Cancel</a>
</form>
{% endblock %}
