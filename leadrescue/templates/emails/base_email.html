<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block subject %}LeadSathi{% endblock %}</title>
<style>
    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #FAFAF8; /* Warm white */
        color: #1C1C1A;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
    }
    .email-wrapper {
        width: 100%;
        background-color: #FAFAF8;
        padding: 40px 20px;
    }
    .email-content {
        max-width: 600px;
        margin: 0 auto;
        background-color: #FFFFFF;
        border: 1px solid #E5DFD5; /* Beige accent */
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .email-header {
        background-color: #F5F2EC; /* Light beige */
        padding: 24px;
        text-align: center;
        border-bottom: 1px solid #E5DFD5;
    }
    .email-header h1 {
        margin: 0;
        font-size: 24px;
        color: #8B5E34; /* Brown */
        font-weight: 600;
        letter-spacing: -0.5px;
    }
    .email-body {
        padding: 32px 24px;
        font-size: 16px;
        line-height: 1.6;
        color: #333333;
    }
    h2 {
        font-size: 20px;
        margin-top: 0;
        color: #1C1C1A;
    }
    p {
        margin: 0 0 16px;
    }
    .button-container {
        text-align: center;
        margin: 32px 0;
    }
    .button {
        display: inline-block;
        background-color: #8B5E34;
        color: #FFFFFF !important;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 6px;
        font-weight: 600;
        font-size: 16px;
        transition: background-color 0.2s;
    }
    .button:hover {
        background-color: #724c29;
    }
    .email-footer {
        text-align: center;
        padding: 24px;
        font-size: 14px;
        color: #8B7355;
    }
    .email-footer p {
        margin: 4px 0;
    }
</style>
</head>
<body>
<table class="email-wrapper" width="100%" cellpadding="0" cellspacing="0" role="presentation">
    <tr>
        <td align="center">
            <table class="email-content" width="100%" cellpadding="0" cellspacing="0" role="presentation">
                <tr>
                    <td class="email-header">
                        <h1>LeadSathi</h1>
                    </td>
                </tr>
                <tr>
                    <td class="email-body">
                        {% block content %}{% endblock %}
                    </td>
                </tr>
            </table>
            <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
                <tr>
                    <td class="email-footer">
                        <p><strong>LeadSathi</strong> &mdash; Har Lead Ka Sathi</p>
                        <p>&copy; {% now "Y" %} LeadSathi. All rights reserved.</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
