{% extends "app_shell.html" %}

{% block app_content %}
<div class="max-w-3xl mx-auto py-8">
  <div class="bg-white rounded-lg shadow p-6">
    <h1 class="text-2xl font-bold mb-4">Bulk Import</h1>
    
    {% if error %}
    <div class="bg-red-50 text-red-600 p-4 rounded mb-4">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" enctype="multipart/form-data" class="space-y-4">
      {% csrf_token %}
      
      <div>
        <label class="block text-sm font-medium text-gray-700">Target Model</label>
        <select name="target_model" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
          <option value="lead">Leads</option>
          <option value="property">Properties</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">CSV or Excel File</label>
        <input type="file" name="file" accept=".csv, .xls, .xlsx" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100" required>
      </div>

      <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded shadow hover:bg-indigo-700">
        Upload & Map Columns
      </button>
    </form>
  </div>
</div>
{% endblock %}
