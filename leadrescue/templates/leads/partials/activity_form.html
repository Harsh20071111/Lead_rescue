<form method="post" action="{% url 'leads:add_activity' lead.pk %}" hx-post="{% url 'leads:add_activity' lead.pk %}" hx-target="#activity-timeline" hx-swap="innerHTML">
    {% csrf_token %}
    {% for field in activity_form %}
        <div style="margin-bottom: 10px;">
            <label style="display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em;">{{ field.label }}</label>
            {{ field }}
        </div>
    {% endfor %}
    <button class="ls-btn ls-btn-primary" style="width: 100%;">Add activity</button>
</form>
