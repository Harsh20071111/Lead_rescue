<div id="task-{{ task.pk }}" style="display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <div>
            <a href="{% url 'leads:detail' task.lead.pk %}" style="color: var(--copy); font-weight: 500; text-decoration: none;">{{ task.lead.name }}</a>
            <div style="font-size: 12px; color: var(--muted); margin-top: 2px;">{{ task.due_date|date:"M j, Y H:i" }} · {{ task.assigned_agent.user.email }}</div>
            {% if task.note %}<p style="color: var(--copy); font-size: 13px; margin-top: 4px;">{{ task.note }}</p>{% endif %}
        </div>
        {% if not task.is_completed %}
        <form method="post" action="{% url 'leads:complete_task' task.pk %}" hx-post="{% url 'leads:complete_task' task.pk %}" hx-target="#task-{{ task.pk }}" hx-swap="outerHTML">
            {% csrf_token %}
            <button class="ls-btn" style="min-height: 28px; font-size: 12px; padding: 0 12px;">Mark complete</button>
        </form>
        {% else %}
        <span class="ls-btn" style="min-height: 28px; font-size: 12px; padding: 0 12px; border-color: var(--green); color: var(--green); cursor: default;">Completed</span>
        {% endif %}
    </div>
</div>
