<form method="post" action="{% url 'leads:assign' lead.pk %}" hx-post="{% url 'leads:assign' lead.pk %}" hx-target="this" hx-swap="outerHTML">
    {% csrf_token %}
    <div style="margin-bottom: 8px;">
        {{ form.assigned_agent }}
    </div>
    <p class="form-hint" style="font-size: 12px; color: var(--muted);">Current: {{ lead.assigned_agent.user.email|default:"Unassigned" }}</p>
</form>
