<div style="display: grid; gap: 10px;">
    {% for activity in activities %}
        <article class="activity-entry">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
                <strong>{{ activity.get_activity_type_display }}</strong>
                <time style="font-size: 12px; color: var(--muted);">{{ activity.created_at|date:"M j, Y H:i" }}</time>
            </div>
            <p>{{ activity.content }}</p>
            <p style="font-size: 11px; color: var(--muted); margin-top: 4px;">{{ activity.agent.user.email }}</p>
        </article>
    {% empty %}
        <p style="font-size: 14px; color: var(--muted);">No activity yet.</p>
    {% endfor %}
</div>
