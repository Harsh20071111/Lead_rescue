<section style="border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 17px 16px; margin-bottom: 16px;">
    <h2 style="color: var(--copy); font-family: 'Cormorant Garamond', serif; font-size: 19px; font-weight: 500; line-height: 1.1; margin: 0 0 12px;">{{ title }}</h2>
    {% for task in tasks %}
        {% include "leads/partials/task_row.html" %}
    {% empty %}
        <p style="font-size: 14px; color: var(--muted);">No follow-ups.</p>
    {% endfor %}
</section>
