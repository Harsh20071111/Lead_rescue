{% extends "app_shell.html" %}

{% block title %}Delete lead - LeadSathi{% endblock %}

{% block extra_css %}
{{ block.super }}
<style>
    .form-page {
        --copy: #2f241f;
        --muted: #7e6f67;
        --panel: #fffaf6;
        --line: #efe3d8;
        --primary: #b56a30;
        --red: #8A341F;
        --red-border: #B85C38;
        max-width: 520px;
    }

    .form-title {
        color: var(--copy);
        font-family: "Cormorant Garamond", serif;
        font-size: 34px;
        font-weight: 400;
        line-height: 1;
        margin: 4px 0 7px;
    }

    .form-subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }

    .form-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 24px;
    }

    .ls-btn {
        display: inline-flex; align-items: center; justify-content: center;
        min-height: 38px; border-radius: 5px; border: 1px solid #5f524b;
        background: transparent; color: var(--copy); padding: 0 17px;
        font-size: 14px; font-weight: 500; text-decoration: none;
        transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }
    .ls-btn-danger { border-color: var(--red-border); background: transparent; color: var(--red); font-weight: 700; }
    .ls-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(47,36,31,.08); }
    .ls-btn:active { transform: translateY(0) scale(.98); }

    .fade-in { animation: fade-up 520ms cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--delay, 0ms); }
    @keyframes fade-up { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .fade-in { animation: none; } .ls-btn { transition: none; } }
</style>
{% endblock %}

{% block app_content %}
<div class="form-page">
    <h1 class="form-title fade-in">Delete {{ object.name }}?</h1>
    <p class="form-subtitle fade-in" style="--delay: 50ms;">This is a permanent delete and requires explicit confirmation.</p>
    <form method="post" class="form-card fade-in" style="--delay: 100ms;">
        {% csrf_token %}
        <div style="display: flex; gap: 12px;">
            <button class="ls-btn ls-btn-danger">Yes, delete lead</button>
            <a href="{% url 'leads:detail' object.pk %}" class="ls-btn">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
