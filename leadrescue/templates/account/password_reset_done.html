{% extends "base.html" %}

{% block title %}Email sent — LeadSathi{% endblock %}

{% block content %}
<main class="flex min-h-screen items-center justify-center bg-cream px-5 py-10 sm:px-8">
    <div class="w-full max-w-lg rounded-lg border border-sand bg-white/80 p-8 text-center shadow-xl shadow-warm/10 backdrop-blur">
        <p class="text-sm font-medium uppercase tracking-[0.16em] text-copper">Check your inbox</p>
        <h1 class="mt-3 text-4xl font-light text-charcoal" style="font-family: 'Cormorant Garamond', serif;">Reset link sent</h1>
        <p class="mt-4 text-sm leading-6 text-warm">
            If the email address exists in our system, you’ll receive a password reset link shortly.
        </p>
        <div class="mt-8 flex flex-col gap-3 sm:flex-row sm:justify-center">
            <a href="{% url 'accounts:login' %}" class="inline-flex items-center justify-center rounded-md bg-charcoal px-5 py-3 text-sm font-semibold text-cream transition hover:bg-warm-muted">
                Back to sign in
            </a>
            <a href="/" class="inline-flex items-center justify-center rounded-md border border-sand px-5 py-3 text-sm font-semibold text-warm transition hover:border-copper hover:text-charcoal">
                Go home
            </a>
        </div>
    </div>
</main>
{% endblock %}
