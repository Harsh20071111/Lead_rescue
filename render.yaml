services:
  - type: web
    name: leadrescue
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd leadrescue && python manage.py migrate --noinput && gunicorn config.wsgi --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: leadrescue-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"

databases:
  - name: leadrescue-db
    plan: free
    databaseName: leadrescue
    user: leadrescue
